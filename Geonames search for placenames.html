<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stedsnavn Suffix Søk</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --ink:#1a1a2e; --paper:#f5f0e8; --gold:#c9a84c; }
body { font-family:'Courier Prime',monospace; background:var(--ink); color:var(--paper); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

header { background:var(--ink); border-bottom:3px solid var(--gold); padding:10px 18px; display:flex; align-items:center; gap:14px; flex-shrink:0; }
header h1 { font-family:'Playfair Display',serif; font-size:1.2rem; }
header h1 em { color:var(--gold); font-style:italic; }
#file-info { font-size:0.68rem; opacity:0.4; margin-left:auto; }

#upload-screen { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; }
.drop-zone { border:2px dashed var(--gold); padding:50px 70px; text-align:center; cursor:pointer; }
.drop-zone:hover { background:rgba(201,168,76,0.06); }
.drop-zone h2 { font-family:'Playfair Display',serif; font-size:1.4rem; margin-bottom:8px; }
.drop-zone p { font-size:0.8rem; opacity:0.5; }
#file-input { display:none; }
.btn { background:var(--gold); color:var(--ink); border:none; padding:10px 24px; font-family:'Courier Prime',monospace; font-weight:700; font-size:0.9rem; cursor:pointer; text-transform:uppercase; }
.btn:hover { background:#b8963a; }

#loading-screen { flex:1; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
.spinner { width:36px; height:36px; border:3px solid rgba(201,168,76,0.2); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#loading-text { font-size:0.8rem; opacity:0.6; }

#app-screen { flex:1; display:none; flex-direction:column; overflow:hidden; }

.toolbar {
  background:#111122; border-bottom:2px solid var(--gold);
  padding:8px 14px; flex-shrink:0;
  display:flex; flex-direction:column; gap:7px;
}
.toolbar-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.toolbar-label { font-size:0.58rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--gold); margin-right:4px; white-space:nowrap; }

.search-wrap { display:flex; gap:6px; flex:1; max-width:340px; }
.search-wrap input {
  flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(201,168,76,0.4);
  color:var(--paper); padding:5px 10px; font-family:'Courier Prime',monospace;
  font-size:0.9rem; outline:none;
}
.search-wrap input:focus { border-color:var(--gold); }
.search-wrap input::placeholder { opacity:0.35; }
.search-wrap button {
  background:var(--gold); color:var(--ink); border:none; padding:5px 14px;
  font-family:'Courier Prime',monospace; font-size:0.8rem; font-weight:700;
  cursor:pointer; text-transform:uppercase;
}
.search-wrap button:hover { background:#b8963a; }

.fc-btn {
  background:transparent; border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.5);
  padding:3px 10px; font-family:'Courier Prime',monospace; font-size:0.72rem;
  cursor:pointer; transition:all 0.12s; white-space:nowrap; border-radius:2px;
}
.fc-btn.active { color:var(--ink); border-color:transparent; font-weight:700; }

.main-layout { flex:1; display:flex; overflow:hidden; min-height:0; }
#map { flex:1; min-width:0; }

.sidebar { width:260px; min-width:260px; display:flex; flex-direction:column; border-left:2px solid var(--gold); overflow:hidden; }
.sidebar-head { padding:9px 13px; border-bottom:1px solid rgba(201,168,76,0.2); font-size:0.62rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--gold); flex-shrink:0; }
.sidebar-search { padding:7px 11px; border-bottom:1px solid rgba(255,255,255,0.07); flex-shrink:0; }
.sidebar-search input { width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(201,168,76,0.3); color:var(--paper); padding:5px 8px; font-family:'Courier Prime',monospace; font-size:0.8rem; outline:none; }
.sidebar-search input:focus { border-color:var(--gold); }
.place-list { overflow-y:auto; flex:1; min-height:0; }
.place-list::-webkit-scrollbar { width:3px; }
.place-list::-webkit-scrollbar-thumb { background:var(--gold); }
.place-item { padding:8px 13px; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; transition:background 0.1s; }
.place-item:hover { background:rgba(201,168,76,0.1); }
.place-item.active { background:rgba(201,168,76,0.18); border-left:3px solid var(--gold); }
.place-name { font-family:'Playfair Display',serif; font-size:0.86rem; }
.place-name em { color:var(--gold); font-style:italic; }
.place-meta { font-size:0.63rem; opacity:0.7; margin-top:2px; }
.no-results { padding:18px 13px; opacity:0.3; font-size:0.78rem; font-style:italic; }
.status-bar { padding:5px 13px; font-size:0.62rem; opacity:0.38; border-top:1px solid rgba(255,255,255,0.07); flex-shrink:0; }

.leaflet-popup-content-wrapper { background:var(--ink); color:var(--paper); border-radius:0; font-family:'Courier Prime',monospace; border:1px solid var(--gold); }
.leaflet-popup-tip { background:var(--ink); }
.popup-name { font-family:'Playfair Display',serif; font-size:0.95rem; color:var(--gold); margin-bottom:3px; }
.popup-detail { font-size:0.7rem; opacity:0.6; line-height:1.7; }
</style>
</head>
<body>

<header>
  <h1>Place Name <em>Suffix</em> Search</h1>
  <div id="file-info">Upload a GeoNames file</div>
</header>

<div id="upload-screen">
  <div class="drop-zone" id="drop-zone">
    <h2>Upload GeoNames file</h2>
    <p>Drag and drop file here, or click</p>
    <p style="margin-top:6px;font-size:0.72rem;opacity:0.35">NO.txt · SE.txt · IS.txt · BR.txt · etc.</p>
  </div>
  <input type="file" id="file-input" accept=".txt">
  <button class="btn" onclick="document.getElementById('file-input').click()">Choose file</button>
</div>

<div id="loading-screen">
  <div class="spinner"></div>
  <div id="loading-text">Reading file...</div>
</div>

<div id="app-screen">
  <div class="toolbar">
    <div class="toolbar-row">
      <span class="toolbar-label">Search suffix:</span>
      <div class="search-wrap">
        <input type="text" id="suffix-input" placeholder="e.g. botn, fjord, sand...">
        <button onclick="doSearch()">Search</button>
      </div>
      <button class="btn" id="export-btn" onclick="exportJSON()" style="display:none;margin-left:8px;padding:5px 14px;font-size:0.78rem">⬇ Export JSON</button>
    </div>
    <div class="toolbar-row" id="fc-row">
      <span class="toolbar-label">Category:</span>
    </div>
  </div>
  <div class="main-layout">
    <div id="map"></div>
    <div class="sidebar">
      <div class="sidebar-head" id="sidebar-head">Enter a suffix</div>
      <div class="sidebar-search">
        <input type="text" id="list-filter" placeholder="Filter list...">
      </div>
      <div class="place-list" id="place-list">
        <div class="no-results">← Search for a suffix</div>
      </div>
      <div class="status-bar" id="status-bar"></div>
    </div>
  </div>
</div>

<script>
const FC_META = {
  P: { label:'Town',    color:'#e85d04' },
  H: { label:'Water',        color:'#2d6a9f' },
  T: { label:'Terrain',     color:'#6b8c42' },
  S: { label:'Settlement',  color:'#9b5de5' },
  A: { label:'Admin',       color:'#c9a84c' },
  L: { label:'Land',        color:'#8b4513' },
  V: { label:'Vegetation',  color:'#2d8a4e' },
  U: { label:'Undersea', color:'#1a6b8a' },
  R: { label:'Road',         color:'#888888' },
};

let allPlaces = [];
let currentSuffix = null;
let currentMatches = [];
let activeFCs = new Set();
let map = null;
let layerGroup = null;

// File handling
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.background='rgba(201,168,76,0.08)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.background='');
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.background=''; if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });

function loadFile(file) {
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('loading-screen').style.display = 'flex';
  document.getElementById('file-info').textContent = file.name + ' · ' + (file.size/1024/1024).toFixed(1) + ' MB';
  const reader = new FileReader();
  reader.onload = e => setTimeout(() => parse(e.target.result), 50);
  reader.readAsText(file, 'UTF-8');
}

function parse(text) {
  allPlaces = [];
  const fcSet = new Set();
  const lines = text.split('\n');
  const total = lines.length;
  let i = 0;

  function chunk() {
    const end = Math.min(i + 8000, total);
    for (; i < end; i++) {
      const line = lines[i];
      if (!line || line[0] === '#') continue;
      const p = line.split('\t');
      if (p.length < 9) continue;
      const name = p[1];
      const lat = parseFloat(p[4]);
      const lng = parseFloat(p[5]);
      const fc = p[6];
      const fc_code = p[7];
      const pop = parseInt(p[14]) || 0;
      if (!name || isNaN(lat) || isNaN(lng)) continue;
      fcSet.add(fc);
      allPlaces.push({ name, lat, lng, fc, fc_code, pop });
    }
    document.getElementById('loading-text').textContent = 'Parsing... ' + Math.round(i/total*100) + '%';
    if (i < total) setTimeout(chunk, 0);
    else {
      // Sort allPlaces by name
      allPlaces.sort((a,b) => a.name.localeCompare(b.name, 'no'));
      const allFCs = [...fcSet].sort();
      allFCs.forEach(fc => activeFCs.add(fc));
      initApp(allFCs);
    }
  }
  chunk();
}

function initApp(allFCs) {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';

  // FC buttons
  const fcRow = document.getElementById('fc-row');
  allFCs.forEach(fc => {
    const meta = FC_META[fc] || { label: fc, color: '#888' };
    const btn = document.createElement('button');
    btn.className = 'fc-btn active';
    btn.textContent = meta.label;
    btn.style.background = meta.color;
    btn.style.borderColor = meta.color;
    btn.style.color = 'var(--ink)';
    btn.dataset.fc = fc;
    btn.addEventListener('click', () => {
      if (activeFCs.has(fc)) {
        activeFCs.delete(fc);
        btn.classList.remove('active');
        btn.style.background = 'transparent';
        btn.style.color = 'rgba(255,255,255,0.5)';
        btn.style.borderColor = 'rgba(255,255,255,0.15)';
      } else {
        activeFCs.add(fc);
        btn.classList.add('active');
        btn.style.background = meta.color;
        btn.style.color = 'var(--ink)';
        btn.style.borderColor = meta.color;
      }
      if (currentSuffix) { renderList(); renderMarkers(); }
    });
    fcRow.appendChild(btn);
  });

  // Map
  requestAnimationFrame(() => requestAnimationFrame(() => {
    map = L.map('map', { center: [20, 10], zoom: 2 });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO', maxZoom: 18
    }).addTo(map);
    layerGroup = L.layerGroup().addTo(map);
    map.invalidateSize();
  }));

  // Enter key search
  document.getElementById('suffix-input').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
  document.getElementById('list-filter').addEventListener('input', renderList);
}

function doSearch() {
  const val = document.getElementById('suffix-input').value.trim().toLowerCase();
  if (!val) return;
  currentSuffix = val;
  document.getElementById('export-btn').style.display = 'inline-block';

  // Find all places ending with this suffix
  currentMatches = allPlaces.filter(p => p.name.toLowerCase().endsWith(val));

  renderList();
  renderMarkers();
}

function getVisible() {
  return currentMatches.filter(p => activeFCs.has(p.fc));
}

function renderList() {
  if (!currentSuffix) return;
  const q = document.getElementById('list-filter').value.toLowerCase();
  const visible = getVisible();
  const filtered = q ? visible.filter(p => p.name.toLowerCase().includes(q)) : visible;

  document.getElementById('sidebar-head').textContent =
    '-' + currentSuffix + ' · ' + visible.length + ' places';

  const listEl = document.getElementById('place-list');
  listEl.innerHTML = '';

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="no-results">No results</div>';
    document.getElementById('status-bar').textContent = '';
    return;
  }

  filtered.forEach(p => {
    const item = document.createElement('div');
    item.className = 'place-item';
    const nl = p.name.toLowerCase();
    const idx = nl.lastIndexOf(currentSuffix);
    const highlighted = idx >= 0
      ? p.name.slice(0,idx) + '<em>' + p.name.slice(idx) + '</em>'
      : p.name;
    const fcMeta = FC_META[p.fc] || { label: p.fc, color: '#888' };
    item.innerHTML =
      '<div class="place-name">' + highlighted + '</div>' +
      '<div class="place-meta" style="color:' + fcMeta.color + '">' +
      fcMeta.label + ' · ' + p.fc_code +
      (p.pop > 0 ? ' · ' + p.pop.toLocaleString() + ' inhab.' : '') + '</div>';
    item.addEventListener('click', () => flyTo(p, item));
    listEl.appendChild(item);
  });

  document.getElementById('status-bar').textContent = 'Showing ' + filtered.length + ' places';
}

function renderMarkers() {
  if (!layerGroup) return;
  layerGroup.clearLayers();
  const visible = getVisible();

  visible.forEach(p => {
    const color = (FC_META[p.fc] || { color:'#888' }).color;
    const marker = L.circleMarker([p.lat, p.lng], {
      radius:5, fillColor:color, color:'#1a1a2e', weight:1.2, fillOpacity:0.85
    });
    const nl = p.name.toLowerCase();
    const idx = nl.lastIndexOf(currentSuffix || '');
    const hl = idx >= 0
      ? p.name.slice(0,idx) + '<em style="color:#c9a84c">' + p.name.slice(idx) + '</em>'
      : p.name;
    const fcMeta = FC_META[p.fc] || { label: p.fc };
    marker.bindPopup(
      '<div class="popup-name">' + hl + '</div>' +
      '<div class="popup-detail">' + fcMeta.label + ' · ' + p.fc_code +
      (p.pop > 0 ? '<br>' + p.pop.toLocaleString() + ' inhabitants' : '') +
      '<br>' + p.lat.toFixed(4) + '°N, ' + p.lng.toFixed(4) + '°E</div>'
    );
    layerGroup.addLayer(marker);
  });

  if (visible.length > 0) {
    const lats = visible.map(p => p.lat);
    const lngs = visible.map(p => p.lng);
    map.fitBounds(
      [[Math.min(...lats), Math.min(...lngs)],[Math.max(...lats), Math.max(...lngs)]],
      { padding:[30,30], maxZoom:10 }
    );
  }
}

function flyTo(place, itemEl) {
  if (!map) return;
  map.setView([place.lat, place.lng], 12, { animate:true });
  layerGroup.eachLayer(m => {
    if (!m.getLatLng) return;
    const ll = m.getLatLng();
    if (Math.abs(ll.lat-place.lat) < 0.0001 && Math.abs(ll.lng-place.lng) < 0.0001) {
      m.openPopup();
      const orig = m.options.fillColor;
      m.setStyle({ fillColor:'#c9a84c', radius:9 });
      setTimeout(() => m.setStyle({ fillColor:orig, radius:5 }), 2000);
    }
  });
  document.querySelectorAll('.place-item').forEach(el => el.classList.remove('active'));
  itemEl.classList.add('active');
  itemEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function exportJSON() {
  if (!currentSuffix) return;
  const visible = getVisible();
  if (visible.length === 0) return;

  const json = {
    customCoordinates: visible.map(p => ({ lat: p.lat, lng: p.lng }))
  };

  const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'suffix_' + currentSuffix + '_' + visible.length + '_locs.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
